identifier_scheme:
  UNINUM:
    meaning: Each Farm Credit System institution's unique identifier, assigned by FCA.
    note: UNINUM is the join key across this whole estate. It appears on all three map layers AND in INST0600.TXT
      inside every quarterly Call Report download (https://www.fca.gov/bank-oversight/call-report-data-for-download),
      which is how the spatial surface and the financial surface are related. FCA does not state this
      anywhere as an API contract; it is observable in both datasets.
    observed_example: 710812
  SYSTEM / DIST / ASSOC: Three-level organisational coding (system, district, association) carried on
    the branches and hq layers.
  FIPS / STATE_FIPS: US Census FIPS county and state codes on the branches layer — an external identifier
    scheme FCA reuses rather than invents.
