description: 'The Farm Credit Administration (FCA) is an independent US federal agency that regulates
  and examines the Farm Credit System (FCS) — a nationwide network of cooperatively owned banks and associations
  providing credit and financial services to farmers, ranchers, agricultural cooperatives and rural infrastructure
  — and the Federal Agricultural Mortgage Corporation (Farmer Mac). FCA publishes no developer portal,
  no API documentation and no OpenAPI, and its own digital strategy still lists "make existing high-value
  data and content available through web APIs" as Not begun, due May 2013. It does, however, serve one
  live, anonymous, machine-readable API that is linked from no developer page: an Esri ArcGIS Server REST
  surface at wgis.fca.gov publishing Farm Credit System institution headquarters, branch offices and chartered-territory
  polygons as JSON, GeoJSON and PBF, keyed on the UNINUM institution identifier that also keys the quarterly
  Call Report bulk downloads.'
