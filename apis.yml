apis:
- name: FCA Farm Credit System Map Services
  description: 'Public, anonymous Esri ArcGIS Server 12.0 REST services publishing the geography of the
    Farm Credit System: 55 ACA/FLCA institution headquarters (charter address, phone, county, CEO and
    chair surnames, institution website), branch offices (address, city/state/ZIP, county, FIPS) and chartered-territory
    polygons. Output as JSON, GeoJSON (application/geo+json) or PBF. No API key, no account, no documented
    rate limit. Read-only: capabilities are Map,Query,Data on all three services. FCA publishes no OpenAPI
    or reference for this surface — every endpoint, field and behaviour recorded here was probed on 2026-09-07
    and the verbatim service and layer descriptors are saved under arcgis/.'
