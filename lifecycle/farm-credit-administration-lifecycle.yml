observed_decay:
  - item: FCS Data Portal
    url: https://ww4.fca.gov/sites/fcsdataportal
    status: 000
    finding: >-
      Linked from https://www.fca.gov/bank-oversight/institution,
      https://www.fca.gov/bank-oversight/fcs-directory-map and apps.fca.gov/Locator/. DNS resolves
      to 4.79.206.89 but TCP connect to both 443 and 80 timed out on every attempt on 2026-09-07.
      The pointer was removed from apis.yml rather than left asserting a page that does not answer.
      FCA still links it from at least three of its own pages.
  - item: FCA digital strategy commitments
    url: https://www.fca.gov/required-notices/digital-strategy
    status: 200
    finding: >-
      FCA's own published digital strategy still carries item 1.2 "Make open data, content, web
      APIs and agency.gov/developer the new default" — Due May 23, 2013, Status "Not begun" — and
      item 2.2 "Make existing high-value data and content available through web APIs" — Due May 23,
      2013, Status "Not begun". The page itself was last updated May 30, 2018. This is FCA stating,
      on its own site, that its web-API commitments are thirteen years past due and unstarted. It
      is the clearest first-party explanation available for why this profile has no OpenAPI.
  - item: apis.yml link rot
    finding: >-
      Three pointers carried in this record 404'd on 2026-09-07 —
      /news-publications/news-releases, /laws-regulations/federal-register-notices and
      /laws-regulations/regulations. All three were repaired against fca.gov's own sitemap.xml in
      this pass (see apis.yml).
migration_notes:
  - >-
      The institution-facing surfaces have moved to apps.fca.gov (FCS Public Directory, Locator) and
      reports.fca.gov (Consolidated Reporting System). Both are live; neither is machine-readable.
